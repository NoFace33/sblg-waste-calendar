name: Refresh calendar

on:
  schedule:
    # Runs on the 1st of every month at 06:00 UTC (02:00 EST / 01:00 EDT)
    - cron: "0 6 1 * *"
  workflow_dispatch:
    # Also triggerable manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the updated .ics file

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch calendar and generate ICS
        run: python fetch_calendar.py

      - name: Commit updated ICS (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add collectes-sblg.ics
          # Only commit if the file actually changed
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh calendar $(date +'%Y-%m-%d')"
            git push
          fi
